[project]
name = "domyn-forge"
version = "0.1.0"
description = "Domyn models, dataloaders and training configs on top of upstream TorchTitan"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Domyn Team", email = "models@domyn.com" },
]

dependencies = [
    # Pinned in [tool.uv.sources]; brings torchdata, datasets, tyro, spmd_types, ...
    "torchtitan==0.3.0",
    "datasets>=3.6.0",
    "pyarrow",
    # 1.0 pre-releases drop AddedToken, which the pinned torchtitan imports.
    "tokenizers<1.0",
    "torch==2.16.0.dev20261019+cu130",
    "triton",
    "tyro",
    "click",
    "rich",
    "transformers>5.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "pyright[nodejs]>=1.1.414",
    "pyarrow-stubs>=20.0.0.20260819",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domyn_forge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
prerelease = "allow"
# prerelease=allow (needed for the torch nightly) would otherwise pick a non-LTS
# Node rc for pyright[nodejs]; the stable wheels are the 24.x LTS line.
constraint-dependencies = ["nodejs-wheel-binaries<25"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torchtitan = { git = "https://github.com/pytorch/torchtitan", tag = "v0.3.0" }
torch = { index = "pytorch-nightly" }
triton = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: multi-GPU end-to-end tests (skipped without enough GPUs; select with `-m integration`)",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
extend-exclude = [
    ".ipynb_checkpoints",
    "docs",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "UP",
    "YTT",
    "BLE",
    "FBT",
    "B",
    "B9",
    "A",
    "C4",
    "T10",
    "EM",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PT",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "ARG",
    "PTH",
    "TRY",
    "NPY",
    "PERF",
    "RUF",
]
ignore = [
    # Missing docstring in public package
    "D100",
    # Missing docstring in public module
    "D104",
    # Not supported by Pydantic
    "UP046",
    # Caching default value is set in the decorator
    "FBT001",
    # Ray type hint is not compatible with paths
    "PTH207",
    # Not supported by enums
    "RUF012",
]

[tool.ruff.lint.extend-per-file-ignores]
# Ignore unused imports
"__init__.py" = ["F401"]
# Ignore pydocstyle rules for tests
# Tests can access private functions
"tests/*" = ["D", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
