[project]
name = "domyn-forge"
version = "0.1.0"
description = "Domyn models, dataloaders and training configs on top of upstream TorchTitan"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Domyn Team", email = "models@domyn.com" },
]

dependencies = [
    # Pinned in [tool.uv.sources]; brings torchdata, datasets, tyro, spmd_types, ...
    "torchtitan==0.3.0",
    "datasets>=3.6.0",
    "pyarrow",
    # 1.0 pre-releases drop AddedToken, which the pinned torchtitan imports.
    "tokenizers<1.0",
    # torch and triton come from the `torch-nightly` group (default) or, with vLLM's own torch, the `vllm` group.
    "tyro",
    "click",
    "rich",
    "transformers>5.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "pyright[nodejs]>=1.1.414",
    "pyarrow-stubs>=20.0.0.20260819",
    "accelerate>=1.15.0",
]
# For training and the tests.
torch-nightly = [
    "torch==2.16.0.dev20261019+cu130",
    "triton",
]
# The same nightly built for AMD GPUs (ROCm), in place of `torch-nightly`:
# `uv sync --no-group torch-nightly --group torch-nightly-rocm`. Brings triton-rocm and the ROCm runtime as wheels.
torch-nightly-rocm = [
    "torch==2.16.0.dev20261019+rocm10.1",
    # Pulled in by the torch wheel. Listed so that uv takes them from the ROCm index (sources apply to direct
    # dependencies only); the wheel pins their versions. Only the data-center GPUs are kept, see
    # `override-dependencies`.
    "triton-rocm",
    "rocm",
    "rocm-sdk-core",
    "rocm-sdk-libraries",
    "rocm-sdk-device-gfx90a",
    "rocm-sdk-device-gfx942",
    "rocm-sdk-device-gfx950",
]
# Serving tests (tests/test_deployed_checkpoint.py): vLLM pins its own torch
vllm = [
    "vllm==0.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domyn_forge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
prerelease = "allow"
# prerelease=allow (needed for the torch nightly) would otherwise pick a non-LTS
# Node rc for pyright[nodejs]; the stable wheels are the 24.x LTS line.
constraint-dependencies = ["nodejs-wheel-binaries<25"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = ["dev", "torch-nightly"]
# The ROCm torch wheel requires the ROCm runtime for every AMD GPU architecture (`rocm[device-all]`). Keep only the
# data-center ones: MI200 (gfx90a), MI300 (gfx942) and MI350 (gfx950). For another AMD GPU, add its `device-<gfx>`
# extra here and its `rocm-sdk-device-<gfx>` package to the `torch-nightly-rocm` group and to the sources.
override-dependencies = ["rocm[libraries,device-gfx90a,device-gfx942,device-gfx950]==10.1.*"]
conflicts = [[{ group = "torch-nightly" }, { group = "torch-nightly-rocm" }, { group = "vllm" }]]

[tool.uv.sources]
torchtitan = { git = "https://github.com/pytorch/torchtitan", tag = "v0.3.0" }
# Only the nightly group comes from the nightly index; vLLM's torch comes from PyPI.
torch = [
    { index = "pytorch-nightly", group = "torch-nightly" },
    { index = "pytorch-nightly-rocm", group = "torch-nightly-rocm" },
]
triton = { index = "pytorch-nightly", group = "torch-nightly" }
# The packages the ROCm torch wheel pulls in come from the same index.
triton-rocm = { index = "pytorch-nightly-rocm", group = "torch-nightly-rocm" }
rocm = { index = "pytorch-nightly-rocm" }
rocm-sdk-core = { index = "pytorch-nightly-rocm", group = "torch-nightly-rocm" }
rocm-sdk-libraries = { index = "pytorch-nightly-rocm", group = "torch-nightly-rocm" }
rocm-sdk-device-gfx90a = { index = "pytorch-nightly-rocm", group = "torch-nightly-rocm" }
rocm-sdk-device-gfx942 = { index = "pytorch-nightly-rocm", group = "torch-nightly-rocm" }
rocm-sdk-device-gfx950 = { index = "pytorch-nightly-rocm", group = "torch-nightly-rocm" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-rocm"
url = "https://download.pytorch.org/whl/nightly/rocm10.1"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: multi-GPU end-to-end tests (skipped without enough GPUs; select with `-m integration`)",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
extend-exclude = [
    ".ipynb_checkpoints",
    "docs",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "UP",
    "YTT",
    "BLE",
    "FBT",
    "B",
    "B9",
    "A",
    "C4",
    "T10",
    "EM",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PT",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "ARG",
    "PTH",
    "TRY",
    "NPY",
    "PERF",
    "RUF",
]
ignore = [
    # Missing docstring in public package
    "D100",
    # Missing docstring in public module
    "D104",
    # Not supported by Pydantic
    "UP046",
    # Caching default value is set in the decorator
    "FBT001",
    # Ray type hint is not compatible with paths
    "PTH207",
    # Not supported by enums
    "RUF012",
]

[tool.ruff.lint.extend-per-file-ignores]
# Ignore unused imports
"__init__.py" = ["F401"]
# Ignore pydocstyle rules for tests
# Tests can access private functions
"tests/*" = ["D", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
